description = 'Spring Boot starter for inference4j'

ext {
    springBootVersion = '4.1.1'
}

dependencies {
    api project(':inference4j-core')
    api project(':inference4j-runtime')
    // Optional: the genai auto-configuration activates only when inference4j-genai is on the classpath
    compileOnly project(':inference4j-genai')

    compileOnly "org.springframework.boot:spring-boot-autoconfigure:${springBootVersion}"
    compileOnly "org.springframework.boot:spring-boot-starter-actuator:${springBootVersion}"
    compileOnly 'io.micrometer:micrometer-core:1.14.4'
    // Optional: the dashboard activates only in a Spring MVC web application
    compileOnly "org.springframework.boot:spring-boot-starter-webmvc:${springBootVersion}"

    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor:${springBootVersion}"

    testImplementation project(':inference4j-genai')
    testImplementation "org.springframework.boot:spring-boot-starter-test:${springBootVersion}"
    testImplementation "org.springframework.boot:spring-boot-starter-actuator:${springBootVersion}"
    testImplementation 'io.micrometer:micrometer-core:1.14.4'
    // Web tests of the models actuator endpoint, through MockMvc
    testImplementation "org.springframework.boot:spring-boot-starter-webmvc:${springBootVersion}"
    testImplementation "org.springframework.boot:spring-boot-webmvc-test:${springBootVersion}"
}

tasks.withType(JavaCompile).configureEach {
    // Actuator endpoints bind request parameters by name, so operation methods need their parameter names
    options.compilerArgs << '-parameters'
}

tasks.named('test') {
    // The object detector tests seed this model cache with a stub model, so building the beans never downloads
    systemProperty 'inference4j.cache.dir', layout.buildDirectory.dir('test-model-cache').get().asFile.absolutePath
    // ...and offline, so the revision check never replaces those stubs with the real models
    systemProperty 'inference4j.offline', 'true'
    // The root build logs tests through slf4j-simple, so @SpringBootTest must not set up Logback
    systemProperty 'org.springframework.boot.logging.LoggingSystem', 'none'
}
